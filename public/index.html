<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronettech Workspace | Gateway</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pnt: {
                            dark: '#0D122B',
                            purple: '#6A1BBF',
                            'purple-light': '#9D4EDD',
                            orange: '#FF7A00',
                            gold: '#FFC107'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col items-center justify-center p-6 selection:bg-pnt-purple selection:text-white relative">

    <div class="absolute top-6 z-50 glass-card rounded-full px-5 py-2.5 flex items-center gap-3 text-[11px] shadow-sm border border-slate-200 max-w-sm sm:max-w-none flex-wrap justify-center">
        <span class="text-slate-500 font-bold uppercase tracking-wider text-[10px]">Architect Demo:</span>
        <button onclick="injectDemo('member', 'Deen Developer', 'PNT-2026-10001')" class="bg-purple-50 hover:bg-purple-100 text-pnt-purple font-bold px-3 py-1 rounded-full border border-purple-200 transition-all">Member Hub</button>
        <button onclick="injectDemo('leader', 'Sub-Admin Michael', 'PNT-2026-LEADER')" class="bg-orange-50 hover:bg-orange-100 text-pnt-orange font-bold px-3 py-1 rounded-full border border-orange-200 transition-all">Leader Board</button>
        <button onclick="injectDemo('admin', 'Global Owner', 'PNT-2026-ADMIN')" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold px-3 py-1 rounded-full border border-red-200 transition-all">Owner Command</button>
    </div>

    <div class="glass-card max-w-md w-full rounded-2xl p-8 text-center shadow-xl relative z-10 transition-all duration-500">
        <div class="mx-auto w-16 h-16 btn-brand-gradient rounded-2xl flex items-center justify-center shadow-lg shadow-pnt-purple/20 mb-6">
            <svg class="w-8 h-8 text-white animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-bold tracking-tight text-pnt-dark">
            Pronettech Workspace
        </h1>
        <p class="text-slate-500 mt-2 text-sm">Synchronizing your secure session...</p>

        <div class="mt-8 flex justify-center">
            <div class="relative w-12 h-12">
                <div class="absolute inset-0 rounded-full border-4 border-slate-100"></div>
                <div class="absolute inset-0 rounded-full border-4 border-t-pnt-purple animate-spin"></div>
            </div>
        </div>

        <p id="status-message" class="text-xs text-slate-400 mt-6 tracking-wide uppercase font-semibold">Verifying Authorization</p>
    </div>

    <script>
        function injectDemo(role, name, customId) {
            localStorage.setItem('pnt_user', JSON.stringify({ role, name, customId }));
            const destinations = { 
                member: '/views/dashboard.html', 
                leader: '/views/leader.html', 
                admin: '/views/admin.html' 
            };
            window.location.href = destinations[role];
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const statusMsg = document.getElementById('status-message');
            
            await new Promise(resolve => setTimeout(resolve, 800));

            try {
                const userSession = localStorage.getItem('pnt_user');
                
                if (!userSession) {
                    statusMsg.textContent = "No session found. Redirecting...";
                    window.location.href = '/views/onboarding.html';
                    return;
                }

                const user = JSON.parse(userSession);
                statusMsg.textContent = `Welcome back! Routing ${user.role}...`;

                if (user.role === 'admin') {
                    window.location.href = '/views/admin.html';
                } else if (user.role === 'leader') {
                    window.location.href = '/views/leader.html';
                } else {
                    window.location.href = '/views/dashboard.html';
                }

            } catch (error) {
                console.error("Gateway routing error:", error);
                statusMsg.textContent = "Session invalid. Resetting...";
                localStorage.removeItem('pnt_user');
                window.location.href = '/views/onboarding.html';
            }
        });
    </script>
</body>
</html>
