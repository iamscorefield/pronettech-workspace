<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronettech Workspace | Reset Password</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pnt: {
                            dark: '#0D122B',
                            purple: '#6A1BBF',
                            'purple-light': '#9D4EDD',
                            orange: '#FF7A00',
                            gold: '#FFC107'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-pnt-dark">

    <div class="sm:mx-auto sm:w-full sm:max-w-md px-4">
        
        <div class="flex justify-center mb-6">
            <div class="flex items-center gap-3">
                <img src="/assets/images/logo.png" alt="Pronettech Logo" class="h-11 w-auto rounded-xl shadow-sm">
                <div>
                    <h2 class="font-bold text-sm tracking-tight text-pnt-dark">Pronettech Workspace</h2>
                    <p class="text-[10px] text-pnt-purple font-semibold tracking-wider uppercase">Security Recovery</p>
                </div>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
            
            <div class="text-center space-y-1">
                <h3 class="text-lg font-bold text-pnt-dark">Create New Password</h3>
                <p class="text-xs text-slate-500">Enter a secure replacement password for your account</p>
            </div>

            <!-- Error Banner -->
            <div id="error-alert" class="hidden bg-red-50 border border-red-200 text-red-600 text-xs p-3 rounded-xl"></div>

            <!-- Success Banner -->
            <div id="success-alert" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs p-3 rounded-xl text-center space-y-2">
                <p class="font-bold">Password successfully updated!</p>
                <p class="text-[11px]">Redirecting you to the sign-in portal...</p>
            </div>

            <form id="reset-password-form" class="space-y-4">
                <div>
                    <label for="new-password" class="block text-xs font-semibold text-slate-600 mb-1.5">New Password</label>
                    <input 
                        type="password" 
                        id="new-password" 
                        required 
                        minlength="6"
                        placeholder="••••••••" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-pnt-dark focus:outline-none focus:ring-1 focus:ring-pnt-purple"
                    >
                </div>

                <div>
                    <label for="confirm-password" class="block text-xs font-semibold text-slate-600 mb-1.5">Confirm New Password</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        required 
                        minlength="6"
                        placeholder="••••••••" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-pnt-dark focus:outline-none focus:ring-1 focus:ring-pnt-purple"
                    >
                </div>

                <button 
                    type="submit" 
                    id="submit-btn" 
                    class="w-full btn-brand-gradient text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all duration-300"
                >
                    Update Password
                </button>
            </form>

            <div class="text-center pt-2">
                <a href="/views/onboarding.html" class="text-xs text-slate-400 hover:text-pnt-purple transition-colors font-medium">
                    Back to Sign In
                </a>
            </div>

        </div>

    </div>

    <script>
        // Extract session recovery hash from URL provided by Supabase email link
        document.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;
            const errorAlert = document.getElementById('error-alert');

            // If Supabase sends error parameters in the hash
            if (hash && hash.includes('error_description')) {
                const params = new URLSearchParams(hash.substring(1));
                errorAlert.textContent = decodeURIComponent(params.get('error_description') || 'Recovery link has expired or is invalid.');
                errorAlert.classList.remove('hidden');
                document.getElementById('reset-password-form').classList.add('opacity-50', 'pointer-events-none');
            }
        });

        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const submitBtn = document.getElementById('submit-btn');
            const errorAlert = document.getElementById('error-alert');
            const successAlert = document.getElementById('success-alert');

            errorAlert.classList.add('hidden');
            errorAlert.textContent = '';

            if (newPassword !== confirmPassword) {
                errorAlert.textContent = 'Passwords do not match. Please verify.';
                errorAlert.classList.remove('hidden');
                return;
            }

            if (newPassword.length < 6) {
                errorAlert.textContent = 'Password must contain at least 6 characters.';
                errorAlert.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving changes...';

            // Extract the access token passed by Supabase in the hash fragment
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = hashParams.get('access_token');

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        password: newPassword,
                        accessToken: accessToken 
                    })
                });

                const resData = await response.json();

                if (resData.success) {
                    document.getElementById('reset-password-form').classList.add('hidden');
                    successAlert.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/views/onboarding.html';
                    }, 2500);
                } else {
                    errorAlert.textContent = resData.message || 'Failed to update credentials.';
                    errorAlert.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Password reset error:', err);
                errorAlert.textContent = 'Server communication failed. Please try again.';
                errorAlert.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
