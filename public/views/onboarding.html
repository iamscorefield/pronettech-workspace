<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronettech Workspace | Join the Network</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pnt: {
                            dark: '#0D122B',
                            purple: '#6A1BBF',
                            'purple-light': '#9D4EDD',
                            orange: '#FF7A00',
                            gold: '#FFC107'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .step-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative selection:bg-pnt-purple selection:text-white overflow-x-hidden bg-slate-50 text-pnt-dark">

    <div class="sm:mx-auto sm:w-full sm:max-w-xl relative z-10">
        <div class="flex justify-center mb-4">
            <div class="flex items-center justify-center">
                <img src="/assets/images/logo.png" alt="Pronettech Logo" class="h-12 w-auto rounded-xl shadow-md">
            </div>
        </div>
        <h2 id="page-title" class="text-center text-3xl font-extrabold tracking-tight text-pnt-dark">
            Welcome to Pronettech Workspace
        </h2>
        <p id="page-subtitle" class="mt-2 text-center text-sm text-slate-500">
            Let's get your corporate profile configured.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-xl relative z-10 px-4 sm:px-0">
        <div class="glass-card py-8 px-6 sm:px-10 rounded-2xl shadow-xl relative overflow-hidden bg-white border border-slate-200">

            <div id="progress-container" class="mb-8">
                <div class="flex items-center justify-between text-xs text-slate-500 uppercase tracking-widest font-semibold mb-2">
                    <span id="step-label">Step 1: Account Info</span>
                    <span id="step-count">1 of 2</span>
                </div>
                <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-pnt-purple to-pnt-orange h-full w-1/2 transition-all duration-500"></div>
                </div>
            </div>

            <!-- REGISTRATION MULTI-STEP FORM -->
            <form id="onboarding-form" class="space-y-6">

                <div id="step-1-container" class="step-transition space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="first_name" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">First Name</label>
                            <input type="text" id="first_name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="John">
                        </div>
                        <div>
                            <label for="last_name" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Last Name</label>
                            <input type="text" id="last_name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="Doe">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Corporate Email Address</label>
                        <input type="email" id="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="johndoe@pronettech.com">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
                            <div class="relative">
                                <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-4 pr-10 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="••••••••">
                                <button type="button" onclick="togglePasswordVisibility('password', 'eye-signup')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                                    <svg id="eye-signup" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label for="phone_number" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Phone Number</label>
                            <input type="tel" id="phone_number" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="+234...">
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="button" id="next-btn" class="w-full btn-brand-gradient font-semibold py-3 px-4 rounded-xl shadow-lg shadow-pnt-purple/20 transition-all duration-300 text-sm flex items-center justify-center gap-2 text-white">
                            Proceed to Office-Branch Selection
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>

                    <p class="text-center text-xs text-slate-500">
                        Already registered? 
                        <button type="button" id="toggle-to-login" class="text-pnt-purple hover:underline font-semibold focus:outline-none ml-1">Sign In Here</button>
                    </p>
                </div>

                <div id="step-2-container" class="step-transition hidden space-y-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-3">Select Assigned Branch Office</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="office-grid">
                            <div class="text-center text-xs py-4 text-slate-400 col-span-2">Loading active network nodes...</div>
                        </div>
                    </div>

                    <div class="border-t border-slate-200 pt-5 space-y-4">
                        <h3 class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Compliance Authorization</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="sponsor_name" class="block text-xs text-slate-500 mb-1">Sponsor Full Name</label>
                                <input type="text" id="sponsor_name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="Verifier name">
                            </div>
                            <div>
                                <label for="sponsor_number" class="block text-xs text-slate-500 mb-1">Sponsor ID Number</label>
                                <input type="text" id="sponsor_number" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="e.g. PNT-SP-992">
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4 pt-2">
                        <button type="button" id="back-btn" class="w-1/3 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-pnt-dark font-semibold py-3 px-4 rounded-xl transition-all duration-300 text-sm">
                            Back
                        </button>
                        <button type="submit" id="submit-btn" class="w-2/3 btn-brand-gradient font-semibold py-3 px-4 rounded-xl shadow-lg shadow-pnt-purple/20 transition-all duration-300 text-sm flex items-center justify-center gap-2 text-white">
                            Finalize Profile Registration
                        </button>
                    </div>
                </div>
            </form>

            <!-- SIGN IN FORM -->
            <form id="login-form" class="step-transition hidden space-y-6">
                <div class="space-y-5">
                    <div>
                        <label for="login_email" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Corporate Email Address</label>
                        <input type="email" id="login_email" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="johndoe@pronettech.com">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label for="login_password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Password</label>
                            <button type="button" onclick="openForgotPasswordModal()" class="text-xs font-semibold text-pnt-purple hover:underline">Forgot Password?</button>
                        </div>
                        <div class="relative">
                            <input type="password" id="login_password" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-4 pr-10 py-3 text-pnt-dark placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pnt-purple/30 focus:border-pnt-purple transition-all text-sm" placeholder="••••••••">
                            <button type="button" onclick="togglePasswordVisibility('login_password', 'eye-login')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                                <svg id="eye-login" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full btn-brand-gradient font-semibold py-3 px-4 rounded-xl shadow-lg shadow-pnt-purple/20 transition-all duration-300 text-sm flex items-center justify-center gap-2 text-white">
                            Authenticate Account
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        </button>
                    </div>

                    <p class="text-center text-xs text-slate-500">
                        New to the Workspace? 
                        <button type="button" id="toggle-to-register" class="text-pnt-purple hover:underline font-semibold focus:outline-none ml-1">Create an Account</button>
                    </p>
                </div>
            </form>

        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div id="forgot-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-pnt-dark">Reset Password</h3>
                <button type="button" onclick="closeForgotPasswordModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold leading-none">&times;</button>
            </div>
            <p class="text-xs text-slate-500">Enter your corporate email address and we'll dispatch a recovery link.</p>
            <form id="forgot-form" class="space-y-3">
                <input type="email" id="forgot-email" required placeholder="yourname@pronettech.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-pnt-dark focus:ring-1 focus:ring-pnt-purple focus:outline-none">
                <div class="flex gap-2 pt-1">
                    <button type="button" onclick="closeForgotPasswordModal()" class="w-1/2 py-2.5 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-xl text-slate-600">Cancel</button>
                    <button type="submit" id="forgot-btn" class="w-1/2 py-2.5 btn-brand-gradient text-white text-xs font-bold rounded-xl shadow-md">Send Link</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const onboardingForm = document.getElementById('onboarding-form');
        const loginForm = document.getElementById('login-form');
        const progressContainer = document.getElementById('progress-container');
        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');

        const nextBtn = document.getElementById('next-btn');
        const backBtn = document.getElementById('back-btn');
        const step1 = document.getElementById('step-1-container');
        const step2 = document.getElementById('step-2-container');
        const stepLabel = document.getElementById('step-label');
        const stepCount = document.getElementById('step-count');
        const progressBar = document.getElementById('progress-bar');
        const officeGrid = document.getElementById('office-grid');

        const toggleToLogin = document.getElementById('toggle-to-login');
        const toggleToRegister = document.getElementById('toggle-to-register');

        let selectedOfficeId = ""; 

        const fallbackOffices = [
            { id: "ab6174a7-8f55-4654-8e1e-c1e0f06536cb", branch_name: "Lagos HQ Hub", total_slots: 14 },
            { id: "bc7285b8-9f66-5765-9f2f-d2f1f17647dc", branch_name: "Abuja Office", total_slots: 6 }
        ];

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
            }
        }

        function openForgotPasswordModal() { document.getElementById('forgot-modal').classList.remove('hidden'); }
        function closeForgotPasswordModal() { document.getElementById('forgot-modal').classList.add('hidden'); }

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('forgot-btn');
            const email = document.getElementById('forgot-email').value.trim();
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) closeForgotPasswordModal();
            } catch (err) {
                alert('Failed to send recovery request.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Link';
            }
        });

        toggleToLogin.addEventListener('click', () => {
            onboardingForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            progressContainer.classList.add('hidden');
            pageTitle.textContent = "Sign In to Workspace";
            pageSubtitle.textContent = "Enter your credentials to access your terminal.";
        });

        toggleToRegister.addEventListener('click', () => {
            loginForm.classList.add('hidden');
            onboardingForm.classList.remove('hidden');
            progressContainer.classList.remove('hidden');
            pageTitle.textContent = "Welcome to Pronettech Workspace";
            pageSubtitle.textContent = "Let's get your corporate profile configured.";
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            stepLabel.textContent = "Step 1: Account Info";
            stepCount.textContent = "1 of 2";
            progressBar.style.width = "50%";
        });

        async function fetchOffices() {
            try {
                const response = await fetch('/api/offices');
                if (!response.ok) throw new Error('Fetch failed.');
                const offices = await response.json();
                renderOfficeGrid(offices);
            } catch (err) {
                renderOfficeGrid(fallbackOffices);
            }
        }

        function renderOfficeGrid(offices) {
            officeGrid.innerHTML = '';
            if (offices.length === 0) {
                officeGrid.innerHTML = `<div class="text-center text-xs py-4 text-slate-400 col-span-2">No branch offices active.</div>`;
                return;
            }

            selectedOfficeId = offices[0].id;

            offices.forEach((office, index) => {
                const isSelected = index === 0;
                const card = document.createElement('div');
                card.setAttribute('data-office-id', office.id);
                card.className = isSelected 
                    ? "border-2 border-pnt-purple bg-purple-50/60 p-4 rounded-xl cursor-pointer transition-all duration-300 office-card"
                    : "border border-slate-200 hover:border-slate-300 bg-slate-50 hover:bg-slate-100 p-4 rounded-xl cursor-pointer transition-all duration-300 office-card";

                card.innerHTML = `
                    <h4 class="font-bold text-sm text-pnt-dark">${office.branch_name || 'Physical Branch'}</h4>
                    <span class="${isSelected ? 'bg-purple-100 text-pnt-purple' : 'bg-slate-200 text-slate-600'} inline-block text-[10px] px-2 py-0.5 rounded-full mt-2 font-semibold">
                        Active Node
                    </span>
                `;

                card.addEventListener('click', () => {
                    selectedOfficeId = office.id;
                    document.querySelectorAll('.office-card').forEach(sibling => {
                        sibling.className = "border border-slate-200 hover:border-slate-300 bg-slate-50 hover:bg-slate-100 p-4 rounded-xl cursor-pointer transition-all duration-300 office-card";
                        const b = sibling.querySelector('span');
                        if(b) b.className = "bg-slate-200 text-slate-600 inline-block text-[10px] px-2 py-0.5 rounded-full mt-2 font-semibold";
                    });
                    card.className = "border-2 border-pnt-purple bg-purple-50/60 p-4 rounded-xl cursor-pointer transition-all duration-300 office-card";
                    const ab = card.querySelector('span');
                    if(ab) ab.className = "bg-purple-100 text-pnt-purple inline-block text-[10px] px-2 py-0.5 rounded-full mt-2 font-semibold";
                });

                officeGrid.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', fetchOffices);

        nextBtn.addEventListener('click', () => {
            const firstName = document.getElementById('first_name').value;
            const lastName = document.getElementById('last_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone_number').value;

            if(!firstName || !lastName || !email || !password || !phone) {
                alert('Please complete all initial profile fields first.');
                return;
            }

            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            stepLabel.textContent = "Step 2: Office & Compliance";
            stepCount.textContent = "2 of 2";
            progressBar.style.width = "100%";
        });

        backBtn.addEventListener('click', () => {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            stepLabel.textContent = "Step 1: Account Info";
            stepCount.textContent = "1 of 2";
            progressBar.style.width = "50%";
        });

        onboardingForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone_number: document.getElementById('phone_number').value,
                office_id: selectedOfficeId,
                sponsor_name: document.getElementById('sponsor_name').value,
                sponsor_number: document.getElementById('sponsor_number').value
            };

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.success) {
                    alert('🎉 Profile Registered successfully! Please proceed to Sign In.');
                    toggleToLogin.click();
                } else {
                    alert(`Error: ${data.message}`);
                }
            } catch (err) {
                console.error(err);
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                email: document.getElementById('login_email').value,
                password: document.getElementById('login_password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('pnt_user', JSON.stringify(data.user));

                    if (data.user.role === 'admin' || data.user.role === 'global_admin') {
                        window.location.href = './admin.html';
                    } else if (data.user.role === 'leader' || data.user.role === 'team_leader') {
                        window.location.href = './leader.html';
                    } else {
                        window.location.href = './dashboard.html';
                    }
                } else {
                    alert(`Access Denied: ${data.message}`);
                }
            } catch (err) {
                alert('Server connection error.');
            }
        });
    </script>
</body>
</html>
