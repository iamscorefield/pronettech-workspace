<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronettech Workspace | My Finance & Dues</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pnt: { dark: '#0D122B', purple: '#6A1BBF', orange: '#FF7A00', gold: '#FFC107' }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-full pb-12 bg-white text-pnt-dark">

    <main class="max-w-7xl mx-auto px-6 mt-8 space-y-8 relative z-10">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-purple-50/50 p-6 rounded-2xl border border-purple-100">
            <div>
                <span class="bg-purple-100 text-pnt-purple text-[10px] font-bold uppercase px-2.5 py-1 rounded-md">Personal Ledger</span>
                <h1 class="text-2xl font-black text-pnt-dark mt-1">My Finance & Earnings</h1>
                <p class="text-xs text-slate-500 mt-0.5">Track your live cashbook balance, earnings history, and submit withdrawal requests.</p>
            </div>
            <button onclick="openWithdrawModal()" class="w-full md:w-auto bg-pnt-purple hover:opacity-90 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-md transition-all cursor-pointer">
                Request Withdrawal ➔
            </button>
        </div>

        <!-- Telemetry Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="p-6 rounded-2xl border border-slate-200 bg-white shadow-xs flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Current Balance</p>
                    <h3 class="text-3xl font-black mt-1 text-emerald-600 font-mono" id="stat-balance">₦0.00</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 border border-emerald-100 rounded-xl flex items-center justify-center text-emerald-600 font-bold text-xl">₦</div>
            </div>

            <div class="p-6 rounded-2xl border border-slate-200 bg-white shadow-xs flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Lifetime Earned</p>
                    <h3 class="text-3xl font-black mt-1 text-pnt-purple font-mono" id="stat-total-earned">₦0.00</h3>
                </div>
                <div class="w-12 h-12 bg-purple-50 border border-purple-100 rounded-xl flex items-center justify-center text-pnt-purple font-bold text-xl">📈</div>
            </div>
        </div>

        <!-- Two Column Layout: Transactions & Withdrawals -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Earnings & Transaction History -->
            <div class="p-6 rounded-2xl border border-slate-200 bg-white shadow-xs space-y-4">
                <h3 class="text-base font-bold text-pnt-dark">Earnings Breakdown</h3>
                <div id="transactions-list" class="space-y-3">
                    <p class="text-xs text-slate-400 py-4 text-center">Loading transactions...</p>
                </div>
            </div>

            <!-- Withdrawal Requests History -->
            <div class="p-6 rounded-2xl border border-slate-200 bg-white shadow-xs space-y-4">
                <h3 class="text-base font-bold text-pnt-dark">Withdrawal Requests</h3>
                <div id="withdrawals-list" class="space-y-3">
                    <p class="text-xs text-slate-400 py-4 text-center">Loading withdrawals...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Withdrawal Request Modal -->
    <div id="withdrawal-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-sm font-bold text-pnt-dark uppercase tracking-wider">New Withdrawal Request</h3>
                <button type="button" onclick="closeWithdrawModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer">&times;</button>
            </div>
            <form id="withdrawal-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Amount to Withdraw (₦)</label>
                    <input type="number" id="withdraw-amount" required min="100" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:ring-1 focus:ring-pnt-purple" placeholder="e.g. 5000">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Purpose / Details</label>
                    <textarea id="withdraw-purpose" rows="3" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:ring-1 focus:ring-pnt-purple" placeholder="Reason for cash out..."></textarea>
                </div>
                <button type="submit" id="submit-withdraw-btn" class="w-full bg-pnt-purple hover:opacity-90 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-sm cursor-pointer">
                    Submit Request
                </button>
            </form>
        </div>
    </div>

    <!-- Universal Navigation Script -->
    <script src="/js/nav.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                const data = await res.json();
                if (!data.success) { window.location.href = '/views/onboarding.html'; return; }
                currentUser = data.user;
                loadMemberCashbook(currentUser.id);
            } catch (err) {
                console.error('Initialization error:', err);
            }
        });

        async function loadMemberCashbook(userId) {
            try {
                const res = await fetch(`/api/finance/cashbook/${userId}`, { credentials: 'include' });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('stat-balance').textContent = `₦${Number(data.cashbook.current_balance || 0).toLocaleString()}`;
                    document.getElementById('stat-total-earned').textContent = `₦${Number(data.cashbook.total_earned || 0).toLocaleString()}`;

                    renderTransactions(data.transactions);
                    renderWithdrawals(data.withdrawals);
                }
            } catch (err) {
                console.error('Failed to load cashbook data:', err);
            }
        }

        function renderTransactions(txs) {
            const container = document.getElementById('transactions-list');
            container.innerHTML = '';
            if (!txs || txs.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 py-4 text-center">No earnings recorded yet.</p>`;
                return;
            }
            txs.forEach(tx => {
                const date = new Date(tx.created_at).toLocaleDateString();
                container.innerHTML += `
                    <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-bold uppercase bg-purple-50 text-pnt-purple border border-purple-200 px-2 py-0.5 rounded">${tx.category}</span>
                            <p class="text-xs text-slate-700 font-medium mt-1">${tx.description || 'No description'}</p>
                            <p class="text-[10px] text-slate-400 mt-0.5">${date}</p>
                        </div>
                        <span class="font-mono font-bold text-emerald-600 text-sm">+₦${Number(tx.amount).toLocaleString()}</span>
                    </div>
                `;
            });
        }

        function renderWithdrawals(ws) {
            const container = document.getElementById('withdrawals-list');
            container.innerHTML = '';
            if (!ws || ws.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 py-4 text-center">No withdrawal requests found.</p>`;
                return;
            }
            ws.forEach(w => {
                let badgeClass = "bg-slate-100 text-slate-700 border-slate-200";
                if (w.status === 'forwarded') badgeClass = "bg-blue-50 text-blue-700 border-blue-200";
                if (w.status === 'approved') badgeClass = "bg-amber-50 text-amber-700 border-amber-200";
                if (w.status === 'paid') badgeClass = "bg-emerald-50 text-emerald-700 border-emerald-200";
                if (w.status === 'rejected') badgeClass = "bg-red-50 text-red-700 border-red-200";

                container.innerHTML += `
                    <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-mono font-bold text-slate-900 text-sm">₦${Number(w.amount).toLocaleString()}</span>
                            <span class="text-[10px] uppercase font-bold px-2 py-0.5 border rounded ${badgeClass}">${w.status}</span>
                        </div>
                        <p class="text-xs text-slate-600">${w.purpose}</p>
                        ${w.admin_receipt_url ? `<a href="${w.admin_receipt_url}" target="_blank" class="text-[11px] font-bold text-pnt-purple underline block mt-1">View Payout Receipt ➔</a>` : ''}
                    </div>
                `;
            });
        }

        function openWithdrawModal() { document.getElementById('withdrawal-modal').classList.remove('hidden'); }
        function closeWithdrawModal() { document.getElementById('withdrawal-modal').classList.add('hidden'); }

        document.getElementById('withdrawal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = document.getElementById('withdraw-amount').value;
            const purpose = document.getElementById('withdraw-purpose').value;

            try {
                const res = await fetch('/api/finance/withdrawal/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ amount, purpose })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Withdrawal request submitted successfully!');
                    closeWithdrawModal();
                    loadMemberCashbook(currentUser.id);
                } else {
                    alert(`Failed: ${data.message}`);
                }
            } catch (err) {
                alert('Connection error.');
            }
        });
    </script>
</body>
</html>
